apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cordonezjolon/book-golang-api.git
    targetRevision: develop
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: books-api-development
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      