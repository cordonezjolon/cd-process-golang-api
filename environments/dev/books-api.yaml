apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cordonezjolon/cd-process-golang-api.git
    targetRevision: develop
    path: apps/books-api
  destination:
    server: https://kubernetes.default.svc
    namespace: books-api-development
   
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      